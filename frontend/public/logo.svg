<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>

    <!-- Crimson Primary Glow Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="45%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Accent Amber/Gold Sparkle Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd000" />
      <stop offset="100%" stop-color="#ff4d00" />
    </linearGradient>

    <!-- Dark Reel Gradient -->
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Outer Rim Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter for Play Button -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#e50914" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="3" />

  <!-- Ambient Glow Behind Film/Clock Ring -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#e50914" stroke-width="4" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Outer Film Reel / Clock Dial Base Ring -->
  <circle cx="256" cy="256" r="160" fill="url(#reelGrad)" stroke="#3f3f46" stroke-width="8" />

  <!-- Film Reel Perforations / Clock Hour Markers (12 Holes around the perimeter) -->
  <g id="film-holes">
    <!-- 12 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" />
    <!-- 1 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(30 256 256)" />
    <!-- 2 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(60 256 256)" />
    <!-- 3 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(90 256 256)" />
    <!-- 4 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(120 256 256)" />
    <!-- 5 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(150 256 256)" />
    <!-- 6 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(180 256 256)" />
    <!-- 7 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(210 256 256)" />
    <!-- 8 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(240 256 256)" />
    <!-- 9 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(270 256 256)" />
    <!-- 10 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(300 256 256)" />
    <!-- 11 O'Clock -->
    <rect x="246" y="110" width="20" height="28" rx="6" fill="#09090b" stroke="#52525b" stroke-width="2.5" transform="rotate(330 256 256)" />
  </g>

  <!-- Inner Movie Circle Wall -->
  <circle cx="256" cy="256" r="105" fill="#0c0a09" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Dynamic Play Button / Clock Wedge (The Hero Icon) -->
  <g filter="url(#dropShadow)">
    <path d="M 215 178 C 215 167 227 160 236 166 L 332 242 C 341 248 341 262 332 268 L 236 344 C 227 350 215 343 215 332 Z" 
          fill="url(#primaryGrad)" />
  </g>

  <!-- Clock Hands / Time Pointer Accents (Representing "Time") -->
  <!-- Minute Hand pointing up-right towards 2 o'clock -->
  <line x1="256" y1="256" x2="310" y2="180" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" opacity="0.95" />
  <!-- Center Pin Jewel -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" stroke="#e50914" stroke-width="4" />
  <circle cx="256" cy="256" r="3" fill="#000000" />

  <!-- Speed Stream Pulse Waves (Top Right - Representing SMB Network Streaming) -->
  <path d="M 390 120 A 210 210 0 0 1 430 190" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <path d="M 415 105 A 240 240 0 0 1 455 175" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" opacity="0.4" />
</svg>
